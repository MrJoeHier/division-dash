<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Division Dash v14</title>
<style>
:root, [data-theme="notebook"] {
  --app-bg:#e8e5de; --paper:#fffef9; --rule:#c9dcee; --margin:#eba9a9; --ink:#363b43; --ink-soft:#8b919b;
  --accent:#3a72d8; --accent-soft:rgba(58,114,216,.13); --carry:#c4621c; --good:#2f9a5a; --bad:#d24848; --warn:#d99a1e;
  --panel:#f2f0eb; --key:#ffffff; --key-ink:#2b2f36; --key-edge:#d3cec4; --key-off:#ece9e3; --header:#faf9f6;
  --slot:#7d8796; --side-bg:rgba(58,114,216,.05); --side-edge:rgba(58,114,216,.28); --overlay:rgba(40,42,48,.45); --card:#ffffff;
}
[data-theme="slate"] {
  --app-bg:#1d2025; --paper:#2a2e35; --rule:#394049; --margin:#62414a; --ink:#e9ebee; --ink-soft:#9aa2ad;
  --accent:#7fb0ff; --accent-soft:rgba(127,176,255,.16); --carry:#f2a65f; --good:#62d394; --bad:#ff7a7a; --warn:#f3c55b;
  --panel:#23272d; --key:#353a42; --key-ink:#eef0f3; --key-edge:#14171b; --key-off:#2b2f36; --header:#23272d;
  --slot:#a8b0bb; --side-bg:rgba(127,176,255,.06); --side-edge:rgba(127,176,255,.3); --overlay:rgba(0,0,0,.55); --card:#2f343c;
}
[data-theme="sand"] {
  --app-bg:#e6ddcc; --paper:#f9f3e5; --rule:#ddd0b5; --margin:#d8a28d; --ink:#4a4136; --ink-soft:#958a7a;
  --accent:#2f7f7a; --accent-soft:rgba(47,127,122,.14); --carry:#b5562a; --good:#3c8a4f; --bad:#c2453a; --warn:#c48a1c;
  --panel:#efe7d8; --key:#fffaf0; --key-ink:#3d352c; --key-edge:#cfc2a8; --key-off:#e9e0cf; --header:#f6f0e3;
  --slot:#8f8371; --side-bg:rgba(47,127,122,.06); --side-edge:rgba(47,127,122,.3); --overlay:rgba(60,50,35,.45); --card:#fffaf0;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; overscroll-behavior:none; background:var(--app-bg); }
body { touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink); overflow:hidden; }
button { font:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }

/* ---------- header ---------- */
header { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:8px 14px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--header); border-bottom:1px solid var(--key-edge); min-height:56px; }
.brand { font-weight:800; font-size:1.1rem; letter-spacing:.01em; white-space:nowrap; }
.brand small { font-weight:600; color:var(--ink-soft); font-size:.75rem; margin-left:4px; }
.chips { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
.chip { background:var(--panel); border:1px solid var(--key-edge); border-radius:999px; padding:6px 9px; font-weight:700; font-size:.9rem; white-space:nowrap; }
.chip .lbl { color:var(--ink-soft); font-weight:600; margin-right:4px; }
.hearts { letter-spacing:2px; font-size:1.05rem; }
.heart { color:var(--bad); display:inline-block; transition:transform .2s; }
.heart.lost { color:var(--key-edge); }
.heart.pop { animation:heartPop .55s ease; }
@keyframes heartPop { 0%{transform:scale(1)} 30%{transform:scale(1.6) rotate(-12deg)} 100%{transform:scale(1)} }
.meter { display:flex; align-items:center; gap:5px; }
.meterbar { position:relative; width:clamp(76px, 12vw, 150px); height:14px; border-radius:999px; background:var(--key-off); border:1px solid var(--key-edge); overflow:hidden; }
.fillbar { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:999px; background:var(--good); transition:width .9s cubic-bezier(.2,.9,.3,1), background .4s; }
.fillbar::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform:translateX(-100%); }
.fillbar.charging::after, .meter.charge .fillbar::after { animation:shine .9s ease-out 2; }
@keyframes shine { to { transform:translateX(100%); } }
.meter .pct { min-width:3.2em; text-align:right; font-variant-numeric:tabular-nums; }
.meter.drain { animation:shake .38s ease; }
.meter.drain .meterbar { box-shadow:0 0 0 3px rgba(210,72,72,.35); }
.meter.charge .meterbar { box-shadow:0 0 0 4px rgba(47,154,90,.35); transition:box-shadow .3s; }
.refill { display:flex; flex-direction:column; align-items:center; gap:6px; margin:10px 0 6px; }
.refill .rlbl { font-weight:800; color:var(--good); }
.refill .meterbar { width:min(320px, 80%); height:22px; }
.refill .pct { font-weight:900; font-size:1.4rem; font-variant-numeric:tabular-nums; }
.cell.qtarget { cursor:pointer; }
.cell.qtarget::after { content:''; position:absolute; left:8%; right:8%; top:6%; bottom:4%; border:2.5px dashed var(--accent); border-radius:10px; background:var(--accent-soft); opacity:.75; }
.cell.qtarget::before { content:''; position:absolute; inset:calc(var(--rh) * -.35) -3px -2px; } /* bigger touch area (upwards into the margin) */
.cell.qtarget.hinting::after { animation:nudge .9s ease-in-out infinite; opacity:1; }
.cell.selq { background:var(--accent-soft); border-radius:8px; box-shadow:inset 0 0 0 2.5px var(--accent); animation:slotPulse 1.3s ease-in-out infinite; }
.timer .tv { font-variant-numeric:tabular-nums; font-size:1.05rem; font-weight:900; min-width:2.7em; display:inline-block; text-align:right; }
.timer.warn { background:#fff3d6; border-color:var(--warn); color:#8a5a00; }
.timer.danger { background:var(--bad); border-color:var(--bad); color:#fff; animation:tpulse 1s ease-in-out infinite; }
.timer.danger .lbl { color:#fff; }
.timer.paused { opacity:.6; }
@keyframes tpulse { 0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(210,72,72,.5);} 50%{ transform:scale(1.08); box-shadow:0 0 0 6px rgba(210,72,72,0);} }
.epseg { margin:6px 0 2px; }
.epbadge { font-size:3.2rem; line-height:1; animation:starIn .6s cubic-bezier(.3,1.7,.5,1); }
.epnext { color:var(--ink) !important; }
.icon-btn { width:44px; height:44px; border-radius:12px; border:1px solid var(--key-edge); background:var(--key); font-size:1.3rem; display:grid; place-items:center; }

/* ---------- paper workspace ---------- */
#work { flex:1 1 auto; min-height:0; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; background:var(--paper); }
#prompt { position:sticky; top:0; left:0; z-index:5; padding:8px 14px; font-weight:700; font-size:1rem; color:var(--ink);
  background:linear-gradient(var(--paper) 70%, transparent); pointer-events:none; min-height:38px; }
#prompt.warnmsg { color:var(--carry); }
#prompt.badmsg { color:var(--bad); }
#board { position:absolute; left:0; top:0; }
.paperbg { position:absolute; left:0; top:0; pointer-events:none;
  background-image:
    linear-gradient(to right, transparent var(--mx), var(--margin) var(--mx), var(--margin) calc(var(--mx) + 2px), transparent calc(var(--mx) + 2px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rh) - 1px), var(--rule) calc(var(--rh) - 1px), var(--rule) var(--rh)); }
.hand { font-family: "Noteworthy", "Chalkboard SE", "Comic Neue", "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; font-variant-numeric:tabular-nums; }
.cell { position:absolute; width:var(--cw); height:var(--rh); display:flex; align-items:flex-end; justify-content:center;
  font-size:calc(var(--rh) * .68); line-height:1; padding-bottom:calc(var(--rh) * .1); color:var(--ink); font-weight:600; }
.cell.divisor { color:var(--ink); }
.cell.quo { color:var(--accent); font-weight:700; }
.cell.cur { background:var(--accent-soft); }
.cell.tap { cursor:pointer; }
.cell.tap::before { content:''; position:absolute; inset:-6px -2px; } /* bigger hit area */
.cell.place-hint { border-radius:8px; }
.cell.placed { background:var(--accent-soft); border-radius:6px; }
.cell.slot::after { content:''; position:absolute; left:10%; right:10%; top:12%; bottom:6%; border:2.5px dashed var(--slot); border-radius:8px; animation:slotPulse 1.3s ease-in-out infinite; }
@keyframes slotPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
.cell.prod { color:var(--ink); }
.cell.diff { color:var(--ink); }
.cell.brought { color:var(--ink); }
.cell.arrive { visibility:hidden; }
.cell.struck > .dg { position:relative; opacity:.55; }
.cell.struck > .dg::after { content:''; position:absolute; left:-18%; right:-18%; top:50%; height:2.5px; border-radius:2px; background:var(--carry); transform:rotate(-58deg); }
.cell.struck.fresh > .dg::after { animation:strike .32s ease-out; }
@keyframes strike { from{ transform:rotate(-58deg) scaleX(0);} to{ transform:rotate(-58deg) scaleX(1);} }
.mark { position:absolute; top:calc(var(--rh) * .02); right:calc(var(--cw) * -.2); font-size:.56em; background:var(--paper); border-radius:4px; padding:0 1px; color:var(--carry); font-weight:800; line-height:1; }
.mark.fresh { animation:markPop .38s cubic-bezier(.3,1.6,.5,1); }
@keyframes markPop { 0%{ transform:translateY(8px) scale(.2); opacity:0;} 100%{ transform:none; opacity:1;} }
.cell.nudge { animation:nudge .9s ease-in-out infinite; border-radius:8px; }
.cell.nudge::before { content:''; position:absolute; inset:2px; border-radius:10px; box-shadow:0 0 0 3px var(--warn); background:rgba(217,154,30,.12); }
@keyframes nudge { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
.cell.shake, .shake { animation:shake .38s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
.cell.glow { animation:glow .6s ease; }
@keyframes glow { 0%{ text-shadow:0 0 0 transparent; transform:scale(1);} 40%{ text-shadow:0 0 14px var(--good); transform:scale(1.18);} 100%{ transform:scale(1);} }
.sign { position:absolute; font-family:-apple-system, "Segoe UI", system-ui, sans-serif; font-weight:500; font-size:calc(var(--rh) * .62); line-height:1; color:var(--ink); display:flex; align-items:flex-end; height:var(--rh); padding-bottom:calc(var(--rh)*.14); width:var(--cw); justify-content:center; }
.rule-line { position:absolute; height:2.5px; background:var(--ink); border-radius:2px; }
svg.bracket { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
svg.bracket path { stroke:var(--ink); stroke-width:3; fill:none; stroke-linecap:round; }
.rlabel { color:var(--accent); font-weight:700; }

/* side multiply problem */
.side { position:absolute; border:2px dashed var(--side-edge); background:var(--side-bg); border-radius:14px; }
.side.fading { animation:fadeOut .7s ease forwards; }
@keyframes fadeOut { 0%{opacity:1} 60%{opacity:1} 100%{opacity:0; transform:scale(.96)} }
.side-in { animation:sideIn .28s ease-out; }
@keyframes sideIn { from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.cell.carryc { font-size:calc(var(--rh) * .36); color:var(--carry); font-weight:800; padding-bottom:0; align-items:center; height:calc(var(--rh) * .6); }
.cell.focus { color:var(--accent); }
.cell.focus::before { content:''; position:absolute; left:14%; right:14%; bottom:4%; height:3px; border-radius:3px; background:var(--accent); opacity:.6; }
.cell.sp-filled { color:var(--ink); }

/* compare box */
.cmp { position:absolute; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 10px; border-radius:14px;
  background:var(--card); border:2px solid var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.15); animation:sideIn .25s ease-out; z-index:4; }
.cmp .q { font-weight:800; font-size:1rem; white-space:nowrap; }
.cmp .row { display:flex; gap:10px; }
.cmp button { min-width:84px; min-height:52px; border-radius:12px; border:2px solid var(--key-edge); background:var(--key); font-size:1.15rem; font-weight:800; }
.cmp button.yes { border-color:var(--good); color:var(--good); }
.cmp button.no { border-color:var(--bad); color:var(--bad); }
.cmp button:active { transform:scale(.96); }

/* ---------- input area ---------- */
#input { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--key-edge); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
#inner { display:grid; gap:10px; max-width:640px; margin:0 auto; grid-template-columns:1fr; grid-template-areas:"steps" "pad" "ctx"; }
.steps { grid-area:steps; display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
.padwrap { grid-area:pad; display:flex; flex-direction:column; gap:8px; }
.cmpbar { display:flex; flex-direction:column; gap:6px; padding:8px; border-radius:16px; background:var(--card); border:2px solid var(--accent); box-shadow:0 6px 18px rgba(0,0,0,.12); }
.cmpbar[hidden] { display:none; }
.cmpbar.in { animation:sideIn .22s ease-out; }
.cmpbar .cq { text-align:center; font-weight:800; font-size:1.05rem; }
.cmpbar .crow { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cbtn { min-height:max(64px, var(--kh, 58px)); border-radius:14px; border:2px solid var(--key-edge); background:var(--key); font-size:1.5rem; font-weight:900; box-shadow:0 3px 0 var(--key-edge); }
.cbtn.yes { border-color:var(--good); color:var(--good); }
.cbtn.no { border-color:var(--bad); color:var(--bad); }
.cbtn:active { transform:translateY(3px); box-shadow:none; }
.cell.cmpnum { color:var(--accent); font-weight:800; }
.cell.cmpnum::after { content:''; position:absolute; left:2%; right:2%; top:10%; bottom:4%; border-radius:8px; background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent); animation:slotPulse 1.3s ease-in-out infinite; }
.cell.cmpdiv { color:var(--accent); font-weight:800; }
.cell.cmpdiv::after { content:''; position:absolute; left:6%; right:6%; bottom:2%; height:3px; border-radius:3px; background:var(--accent); }
.pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.pad .zero { grid-column:1 / span 3; }
.ctx { grid-area:ctx; display:flex; gap:8px; }
.ctx button { flex:1; }
.key, .step, .ctxb { min-height:var(--kh, 58px); border-radius:14px; border:1px solid var(--key-edge); background:var(--key); color:var(--key-ink);
  box-shadow:0 3px 0 var(--key-edge); font-weight:800; transition:transform .06s, box-shadow .06s, background .15s, opacity .15s; position:relative; }
.key { font-size:1.6rem; }
.step { font-size:2rem; line-height:1; }
.ctxb { font-size:1.05rem; }
.key:active:not(:disabled), .step:active:not(:disabled), .ctxb:active:not(:disabled), .pressed { transform:translateY(3px); box-shadow:0 0 0 var(--key-edge); }
.step.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 3px 0 rgba(0,0,0,.25); }
.step.okflash { animation:okflash .45s ease; }
@keyframes okflash { 0%{ box-shadow:0 0 0 0 var(--good);} 60%{ box-shadow:0 0 0 10px transparent;} }
button:disabled { opacity:.38; cursor:default; background:var(--key-off); box-shadow:none; }
.ctxb.cant { border-color:var(--carry); color:var(--carry); }
.ctxb.hidden { display:none; }
.wrongflash { background:var(--bad) !important; color:#fff !important; }

@media (orientation: landscape) and (min-width: 700px) {
  #inner { max-width:1000px; grid-template-columns: 1.25fr 1fr; grid-template-areas:"steps pad" "ctx pad"; align-items:start; }
  .steps { align-self:stretch; }
  .step { min-height:calc(var(--kh, 54px) * 1.55); }
  #input { --kh: min(54px, 7.4vh); }
}
@media (orientation: portrait) { #input { --kh: min(60px, 6.2vh); } }

/* ---------- overlays ---------- */
.overlay { position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.card { background:var(--card); color:var(--ink); border-radius:22px; padding:24px 26px; width:min(560px, 100%); max-height:90vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center; animation:cardIn .35s cubic-bezier(.2,1.3,.4,1); }
@keyframes cardIn { from{ transform:scale(.85); opacity:0;} to{ transform:none; opacity:1;} }
.card h1 { margin:4px 0 6px; font-size:2rem; }
.card h2 { margin:4px 0 8px; font-size:1.6rem; }
.card p { margin:6px 0 14px; color:var(--ink-soft); font-weight:600; }
.big { min-height:58px; padding:0 28px; border-radius:16px; border:none; background:var(--accent); color:#fff; font-size:1.2rem; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.2); margin-top:8px; }
.big:active { transform:translateY(3px); box-shadow:none; }
.big.secondary { background:var(--key); color:var(--key-ink); border:1px solid var(--key-edge); }
.stars { font-size:2.6rem; letter-spacing:6px; margin:6px 0; }
.stars .s { display:inline-block; color:var(--key-edge); }
.stars .s.on { color:#f4b400; animation:starIn .5s cubic-bezier(.3,1.7,.5,1) backwards; }
@keyframes starIn { from{ transform:scale(0) rotate(-90deg);} to{ transform:none;} }
.eq { font-size:1.6rem; font-weight:700; margin:6px 0; color:var(--ink); }
.lvgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; margin:12px 0; text-align:left; }
.lv { min-height:64px; border-radius:14px; border:2px solid var(--key-edge); background:var(--key); padding:8px 10px; text-align:left; }
.lv b { display:block; font-size:1rem; }
.lv span { font-size:.78rem; color:var(--ink-soft); font-weight:600; }
.lv.sel { border-color:var(--accent); background:var(--accent-soft); }
.set-row { display:flex; flex-direction:column; gap:8px; text-align:left; margin:14px 0; }
.set-row > label { font-weight:800; font-size:.95rem; }
.seg { display:flex; gap:6px; flex-wrap:wrap; }
.seg button { flex:1; min-height:50px; border-radius:12px; border:2px solid var(--key-edge); background:var(--key); font-weight:700; padding:4px 10px; }
.seg button.sel { border-color:var(--accent); background:var(--accent-soft); }
.seg button .soon { display:block; font-size:.7rem; color:var(--ink-soft); font-weight:600; }
.toast { position:fixed; left:50%; top:76px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-weight:700; z-index:80; animation:fadeIn .2s; pointer-events:none; }
.flyer { position:fixed; z-index:60; pointer-events:none; display:flex; align-items:flex-end; justify-content:center; color:var(--ink); font-weight:600; line-height:1; will-change:transform; }
.flyer.ghost { opacity:.55; color:var(--accent); }
.confetti { position:fixed; width:10px; height:14px; z-index:70; pointer-events:none; border-radius:2px; }
.combo { position:fixed; z-index:65; pointer-events:none; font-weight:900; color:var(--good); font-size:1.3rem; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Division Dash <small>v14</small></div>
    <div class="chips">
      <div class="chip"><span id="h-level">E1 · L1</span></div>
      <div class="chip timer" id="h-time" aria-label="Time left"><span class="lbl">⏱</span><span class="tv">4:00</span></div>
      <div class="chip"><span class="lbl">Problem</span><span id="h-prob">1/5</span></div>
      <div class="chip meter" id="h-meter" aria-label="Strength"><span class="lbl">Strength</span><div class="meterbar"><div class="fillbar"></div></div><span class="pct">100%</span></div>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙︎</button>
    </div>
  </header>
  <main id="work">
    <div id="prompt"></div>
    <div id="board"></div>
  </main>
  <section id="input">
    <div id="inner">
      <div class="steps">
        <button class="step" data-step="divide" aria-label="Divide">÷</button>
        <button class="step" data-step="multiply" aria-label="Multiply">×</button>
        <button class="step" data-step="subtract" aria-label="Subtract">−</button>
        <button class="step" data-step="compare" aria-label="Compare">C</button>
        <button class="step" data-step="bring" aria-label="Bring down">↓</button>
      </div>
      <div class="padwrap">
      <div id="cmpbar" class="cmpbar" hidden role="group" aria-label="Compare">
        <div class="cq">Smaller than divisor?</div>
        <div class="crow"><button id="cmp-yes" class="cbtn yes" data-act="yes">Yes</button><button id="cmp-no" class="cbtn no" data-act="no">No</button></div>
      </div>
      <div class="pad">
        <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
        <button class="key zero" data-key="0">0</button>
      </div>
      </div>
      <div class="ctx">

      (P.pens === 0 ? "Perfect — no mistakes!" : P.pens + (P.pens === 1 ? " slip" : " slips") + " this time.") + '</p><button class="big" data-act="next">' + (G.probIdx + 1 >= G.problems.length ? "Finish level" : "Next problem") + " ▶</button>";
  } else if (o.type === "level") {
    const tot = G.stars.reduce((a, b) => a + (b || 0), 0);
    h = "<h1>🏅 E" + (G.episode + 1) + " · Level " + (G.level + 1) + " complete!</h1>" + '<div class="stars" style="font-size:1.6rem">' + G.stars.map(s => "★".repeat(s) + "☆".repeat(3 - s)).join(" ") + "</div><p>" + tot + " of " + G.problems.length * 3 + " stars</p>" + refillHtml(o) +
      '<button class="big" data-act="next">Level ' + (G.level + 2) + ": " + LEVELS[G.level + 1].name + " ▶</button>";
  } else if (o.type === "episode") {
    const tot = G.stars.reduce((a, b) => a + (b || 0), 0), nx = EPISODES[G.episode + 1].secs / 60;
    h = '<div class="epbadge">🎉</div><h1>Episode ' + (G.episode + 1) + " complete!</h1><p>All four levels passed. Level 4: " + tot + " of " + G.problems.length * 3 + " stars.</p>" + refillHtml(o) +
      '<p class="epnext">Episode ' + (G.episode + 2) + ": same four levels, but only <b>" + nx + ":00</b> per problem.</p>" + '<button class="big" data-act="next">Start Episode ' + (G.episode + 2) + " ▶</button>";
  } else if (o.type === "timeup") {
    h = '<div class="epbadge">⏰</div><h2>Time\'s up!</h2><p>E' + (G.episode + 1) + " · Level " + (G.level + 1) + " — " + LEVELS[G.level].name + ". You have " + fmtTime(EPISODES[G.episode].secs) + " per problem. Recharge to 100% and try again with fresh problems.</p>" + '<button class="big" data-act="next">Retry level ' + (G.level + 1) + "</button>";
  } else if (o.type === "all") {
    h = '<div class="epbadge">🏆</div><h1>Division Champion!</h1><p>You beat all three episodes — every level, against the clock.</p>' + refillHtml(o) + '<button class="big" data-act="next">Play again</button>';
  } else if (o.type === "over") {
    h = "<h2>Out of strength</h2>" + '<div class="refill"><div class="meterbar"><div class="fillbar" style="width:0%"></div></div><div class="pct">0%</div></div>' + "<p>E" + (G.episode + 1) + " · Level " + (G.level + 1) + " — " + LEVELS[G.level].name + ". Recharge to 100% and try again with fresh problems.</p>" + '<button class="big" data-act="next">Retry level ' + (G.level + 1) + "</button>";
  } else if (o.type === "settings") {
    h = "<h2>Settings</h2>" +
      '<div class="set-row"><label>Answer format</label><div class="seg">' +
      '<button class="sel" data-format="remainders">Remainders</button><button data-format="fractions">Fractions<span class="soon">coming soon</span></button><button data-format="decimals">Decimals<span class="soon">coming soon</span></button></div></div>' +
      '<div class="set-row"><label>Look</label><div class="seg">' + THEMES.map(t => '<button data-theme-btn="' + t[0] + '" class="' + (settings.theme === t[0] ? "sel" : "") + '">' + t[1] + "</button>").join("") + "</div></div>" +
      '<div class="set-row"><label>Sound &amp; feel</label><div class="seg"><button data-toggle="sound" class="' + (settings.sound ? "sel" : "") + '">Sound ' + (settings.sound ? "on" : "off") + '</button><button data-toggle="haptics" class="' + (settings.haptics ? "sel" : "") + '">Vibration ' + (settings.haptics ? "on" : "off") + (canVibrate ? "" : '<span class="soon">not supported on this device</span>') + "</button></div></div>" +
      '<div class="set-row"><label>Jump to episode &amp; level (restarts with 100% strength)</label>' + epSeg(o.jumpEp !== undefined ? o.jumpEp : G.episode, "jumpep") + '<div class="seg">' + LEVELS.map((L, i) => '<button data-jump="' + i + '" class="' + (G.level === i && (o.jumpEp === undefined || o.jumpEp === G.episode) ? "sel" : "") + '">Level ' + (i + 1) + "</button>").join("") + "</div></div>" +
      '<button class="big" data-act="next">Close</button>';
  }
  root.innerHTML = '<div class="overlay"><div class="card">' + h + "</div></div>";
}

/* ================= input wiring ================= */
function press(el) { if (!el) return; el.classList.add("pressed"); setTimeout(() => el.classList.remove("pressed"), 90); }
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-place], [data-divtap], [data-top], [data-act]");
  if (!t) return;
  audio();
  if (t.dataset.place !== undefined) return act("place", +t.dataset.place);
  if (t.dataset.divtap !== undefined) return act("divtap", +t.dataset.divtap);
  if (t.dataset.top !== undefined) return act("top", +t.dataset.top);
  if (t.dataset.step) return act("step", t.dataset.step);
  if (t.dataset.key) return act("digit", +t.dataset.key);
  if (t.id === "btn-rem") return act("remainder");
  if (t.id === "btn-done") return act("done");
  if (t.id === "btn-cant") return act("cant");
  if (t.id === "btn-settings") { if (G.overlay && G.overlay.type === "settings") return; G.overlay = { type: "settings", prev: G.overlay }; render(); return; }
  if (t.dataset.ep !== undefined) { G.overlay.ep = +t.dataset.ep; SFX.step(); render(); return; }
  if (t.dataset.jumpep !== undefined) { G.overlay.jumpEp = +t.dataset.jumpep; SFX.step(); render(); return; }
  if (t.dataset.lv !== undefined) { G.overlay.sel = +t.dataset.lv; SFX.step(); render(); return; }
  if (t.dataset.format) { if (t.dataset.format !== "remainders") { toast((t.dataset.format === "fractions" ? "Fractions" : "Decimals") + " mode is coming soon"); SFX.nudge(); } return; }
  if (t.dataset.themeBtn) { settings.theme = t.dataset.themeBtn; store.set("theme", settings.theme); document.documentElement.setAttribute("data-theme", settings.theme); $("#overlay-root").dataset.sig = ""; render(); return; }
  if (t.dataset.toggle) { settings[t.dataset.toggle] = !settings[t.dataset.toggle]; store.set(t.dataset.toggle, settings[t.dataset.toggle]); $("#overlay-root").dataset.sig = ""; if (t.dataset.toggle === "haptics") haptic(30); else SFX.step(); render(); return; }
  if (t.dataset.jump !== undefined) { const ep = G.overlay.jumpEp !== undefined ? G.overlay.jumpEp : G.episode; G.overlay = null; G.started = true; G.episode = ep; newLevel(+t.dataset.jump, false); return; }
  if (t.dataset.act === "next") return act("next");
  if (t.dataset.act === "yes") return act("yes");
  if (t.dataset.act === "no") return act("no");
});
const KEYMAP = { "/": ["step", "divide"], "÷": ["step", "divide"], "*": ["step", "multiply"], "x": ["step", "multiply"], "X": ["step", "multiply"], "-": ["step", "subtract"],
  "<": ["step", "compare"], ",": ["step", "compare"], "b": ["step", "bring"], "B": ["step", "bring"], "ArrowDown": ["step", "bring"],
  "r": ["remainder"], "R": ["remainder"], "y": ["yes"], "Y": ["yes"], "n": ["no"], "N": ["no"], "c": ["cant"], "C": ["cant"] };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  audio();
  if (e.key === "Escape" && G.overlay && G.overlay.type === "settings") { act("next"); return; }
  if (/^[0-9]$/.test(e.key)) {
    if (G.overlay) return;
    press(document.querySelector('.key[data-key="' + e.key + '"]'));
    const k = document.querySelector('.key[data-key="' + e.key + '"]'); if (k && k.disabled) return;
    act("digit", +e.key); e.preventDefault(); return;
  }
  if (e.key === "Enter") { e.preventDefault(); if (G.overlay) return act("next"); return act("done"); }
  const m = KEYMAP[e.key];
  if (m && !G.overlay) { e.preventDefault(); if (m[0] === "step") press(document.querySelector(STEP_SEL(m[1]))); act(m[0], m[1]); }
});
// iOS: block pinch / double-tap zoom gestures
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
let lastTouch = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTouch < 320 && e.target.closest("button, .tap")) { e.preventDefault(); e.target.click && e.target.closest("button, .tap").click(); } lastTouch = now; }, { passive: false });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (G.P) render(); }, 80); });

/* ================= boot ================= */
G.overlay = { type: "start", sel: 0, ep: 0 };
G.problems = genLevel(0); startProblem(); G.overlay = { type: "start", sel: 0, ep: 0 }; render();
try { const sp = parseFloat(new URLSearchParams(location.search).get("timerSpeed")); if (sp > 0) G.timeScale = sp; } catch (e) {}

window.__DD = { G, EPISODES, render: () => render(), setTimeScale: v => { G.timeScale = v; }, act, analyze, mulSteps, genLevel, newLevel, LEVELS, setAnim: v => { ANIM = v; }, setLock: () => { lockUntil = 0; },
  loadProblem(D, d) { G.overlay = null; G.problems[G.probIdx] = { D: String(D), d }; startProblem(); }, state: () => { const P = G.P; return P && { episode: G.episode, level: G.level, timeLeft: G.timeLeft, overlay: G.overlay && G.overlay.type, phase: P.phase, expect: P.expect, cur: P.cur, lives: G.strength, strength: G.strength, pens: P.pens, msg: P.msg, nudgeK: P.nudgeK, cycles: P.cycles.map(c => ({ pos: c.pos, top: c.topStr, q: c.q, prevQ: c.prevQ, diff: c.diff, sub: c.sub && { col: c.sub.col, work: c.sub.work.slice(), written: c.sub.written.slice(), impossible: c.sub.impossible }, mulIdx: c.mul && c.mul.idx })) }; } };
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root, [data-theme="notebook"] {
  --app-bg:#e8e5de; --paper:#fffef9; --rule:#c9dcee; --margin:#eba9a9; --ink:#363b43; --ink-soft:#8b919b;
  --accent:#3a72d8; --accent-soft:rgba(58,114,216,.13); --carry:#c4621c; --good:#2f9a5a; --bad:#d24848; --warn:#d99a1e;
  --panel:#f2f0eb; --key:#ffffff; --key-ink:#2b2f36; --key-edge:#d3cec4; --key-off:#ece9e3; --header:#faf9f6;
  --slot:#7d8796; --side-bg:rgba(58,114,216,.05); --side-edge:rgba(58,114,216,.28); --overlay:rgba(40,42,48,.45); --card:#ffffff;
}
[data-theme="slate"] {
  --app-bg:#1d2025; --paper:#2a2e35; --rule:#394049; --margin:#62414a; --ink:#e9ebee; --ink-soft:#9aa2ad;
  --accent:#7fb0ff; --accent-soft:rgba(127,176,255,.16); --carry:#f2a65f; --good:#62d394; --bad:#ff7a7a; --warn:#f3c55b;
  --panel:#23272d; --key:#353a42; --key-ink:#eef0f3; --key-edge:#14171b; --key-off:#2b2f36; --header:#23272d;
  --slot:#a8b0bb; --side-bg:rgba(127,176,255,.06); --side-edge:rgba(127,176,255,.3); --overlay:rgba(0,0,0,.55); --card:#2f343c;
}
[data-theme="sand"] {
  --app-bg:#e6ddcc; --paper:#f9f3e5; --rule:#ddd0b5; --margin:#d8a28d; --ink:#4a4136; --ink-soft:#958a7a;
  --accent:#2f7f7a; --accent-soft:rgba(47,127,122,.14); --carry:#b5562a; --good:#3c8a4f; --bad:#c2453a; --warn:#c48a1c;
  --panel:#efe7d8; --key:#fffaf0; --key-ink:#3d352c; --key-edge:#cfc2a8; --key-off:#e9e0cf; --header:#f6f0e3;
  --slot:#8f8371; --side-bg:rgba(47,127,122,.06); --side-edge:rgba(47,127,122,.3); --overlay:rgba(60,50,35,.45); --card:#fffaf0;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; overscroll-behavior:none; background:var(--app-bg); }
body { touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink); overflow:hidden; }
button { font:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }

/* ---------- header ---------- */
header { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:8px 14px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--header); border-bottom:1px solid var(--key-edge); min-height:56px; }
.brand { font-weight:800; font-size:1.1rem; letter-spacing:.01em; white-space:nowrap; }
.brand small { font-weight:600; color:var(--ink-soft); font-size:.75rem; margin-left:4px; }
.chips { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
.chip { background:var(--panel); border:1px solid var(--key-edge); border-radius:999px; padding:6px 9px; font-weight:700; font-size:.9rem; white-space:nowrap; }
.chip .lbl { color:var(--ink-soft); font-weight:600; margin-right:4px; }
.hearts { letter-spacing:2px; font-size:1.05rem; }
.heart { color:var(--bad); display:inline-block; transition:transform .2s; }
.heart.lost { color:var(--key-edge); }
.heart.pop { animation:heartPop .55s ease; }
@keyframes heartPop { 0%{transform:scale(1)} 30%{transform:scale(1.6) rotate(-12deg)} 100%{transform:scale(1)} }
.meter { display:flex; align-items:center; gap:5px; }
.meterbar { position:relative; width:clamp(76px, 12vw, 150px); height:14px; border-radius:999px; background:var(--key-off); border:1px solid var(--key-edge); overflow:hidden; }
.fillbar { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:999px; background:var(--good); transition:width .9s cubic-bezier(.2,.9,.3,1), background .4s; }
.fillbar::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform:translateX(-100%); }
.fillbar.charging::after, .meter.charge .fillbar::after { animation:shine .9s ease-out 2; }
@keyframes shine { to { transform:translateX(100%); } }
.meter .pct { min-width:3.2em; text-align:right; font-variant-numeric:tabular-nums; }
.meter.drain { animation:shake .38s ease; }
.meter.drain .meterbar { box-shadow:0 0 0 3px rgba(210,72,72,.35); }
.meter.charge .meterbar { box-shadow:0 0 0 4px rgba(47,154,90,.35); transition:box-shadow .3s; }
.refill { display:flex; flex-direction:column; align-items:center; gap:6px; margin:10px 0 6px; }
.refill .rlbl { font-weight:800; color:var(--good); }
.refill .meterbar { width:min(320px, 80%); height:22px; }
.refill .pct { font-weight:900; font-size:1.4rem; font-variant-numeric:tabular-nums; }
.cell.qtarget { cursor:pointer; }
.cell.qtarget::after { content:''; position:absolute; left:8%; right:8%; top:6%; bottom:4%; border:2.5px dashed var(--accent); border-radius:10px; background:var(--accent-soft); opacity:.75; }
.cell.qtarget::before { content:''; position:absolute; inset:calc(var(--rh) * -.35) -3px -2px; } /* bigger touch area (upwards into the margin) */
.cell.qtarget.hinting::after { animation:nudge .9s ease-in-out infinite; opacity:1; }
.cell.selq { background:var(--accent-soft); border-radius:8px; box-shadow:inset 0 0 0 2.5px var(--accent); animation:slotPulse 1.3s ease-in-out infinite; }
.timer .tv { font-variant-numeric:tabular-nums; font-size:1.05rem; font-weight:900; min-width:2.7em; display:inline-block; text-align:right; }
.timer.warn { background:#fff3d6; border-color:var(--warn); color:#8a5a00; }
.timer.danger { background:var(--bad); border-color:var(--bad); color:#fff; animation:tpulse 1s ease-in-out infinite; }
.timer.danger .lbl { color:#fff; }
.timer.paused { opacity:.6; }
@keyframes tpulse { 0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(210,72,72,.5);} 50%{ transform:scale(1.08); box-shadow:0 0 0 6px rgba(210,72,72,0);} }
.epseg { margin:6px 0 2px; }
.epbadge { font-size:3.2rem; line-height:1; animation:starIn .6s cubic-bezier(.3,1.7,.5,1); }
.epnext { color:var(--ink) !important; }
.icon-btn { width:44px; height:44px; border-radius:12px; border:1px solid var(--key-edge); background:var(--key); font-size:1.3rem; display:grid; place-items:center; }

/* ---------- paper workspace ---------- */
#work { flex:1 1 auto; min-height:0; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; background:var(--paper); }
#prompt { position:sticky; top:0; left:0; z-index:5; padding:8px 14px; font-weight:700; font-size:1rem; color:var(--ink);
  background:linear-gradient(var(--paper) 70%, transparent); pointer-events:none; min-height:38px; }
#prompt.warnmsg { color:var(--carry); }
#prompt.badmsg { color:var(--bad); }
#board { position:absolute; left:0; top:0; }
.paperbg { position:absolute; left:0; top:0; pointer-events:none;
  background-image:
    linear-gradient(to right, transparent var(--mx), var(--margin) var(--mx), var(--margin) calc(var(--mx) + 2px), transparent calc(var(--mx) + 2px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rh) - 1px), var(--rule) calc(var(--rh) - 1px), var(--rule) var(--rh)); }
.hand { font-family: "Noteworthy", "Chalkboard SE", "Comic Neue", "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; font-variant-numeric:tabular-nums; }
.cell { position:absolute; width:var(--cw); height:var(--rh); display:flex; align-items:flex-end; justify-content:center;
  font-size:calc(var(--rh) * .68); line-height:1; padding-bottom:calc(var(--rh) * .1); color:var(--ink); font-weight:600; }
.cell.divisor { color:var(--ink); }
.cell.quo { color:var(--accent); font-weight:700; }
.cell.cur { background:var(--accent-soft); }
.cell.tap { cursor:pointer; }
.cell.tap::before { content:''; position:absolute; inset:-6px -2px; } /* bigger hit area */
.cell.place-hint { border-radius:8px; }
.cell.placed { background:var(--accent-soft); border-radius:6px; }
.cell.slot::after { content:''; position:absolute; left:10%; right:10%; top:12%; bottom:6%; border:2.5px dashed var(--slot); border-radius:8px; animation:slotPulse 1.3s ease-in-out infinite; }
@keyframes slotPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
.cell.prod { color:var(--ink); }
.cell.diff { color:var(--ink); }
.cell.brought { color:var(--ink); }
.cell.arrive { visibility:hidden; }
.cell.struck > .dg { position:relative; opacity:.55; }
.cell.struck > .dg::after { content:''; position:absolute; left:-18%; right:-18%; top:50%; height:2.5px; border-radius:2px; background:var(--carry); transform:rotate(-58deg); }
.cell.struck.fresh > .dg::after { animation:strike .32s ease-out; }
@keyframes strike { from{ transform:rotate(-58deg) scaleX(0);} to{ transform:rotate(-58deg) scaleX(1);} }
.mark { position:absolute; top:calc(var(--rh) * .02); right:calc(var(--cw) * -.2); font-size:.56em; background:var(--paper); border-radius:4px; padding:0 1px; color:var(--carry); font-weight:800; line-height:1; }
.mark.fresh { animation:markPop .38s cubic-bezier(.3,1.6,.5,1); }
@keyframes markPop { 0%{ transform:translateY(8px) scale(.2); opacity:0;} 100%{ transform:none; opacity:1;} }
.cell.nudge { animation:nudge .9s ease-in-out infinite; border-radius:8px; }
.cell.nudge::before { content:''; position:absolute; inset:2px; border-radius:10px; box-shadow:0 0 0 3px var(--warn); background:rgba(217,154,30,.12); }
@keyframes nudge { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
.cell.shake, .shake { animation:shake .38s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
.cell.glow { animation:glow .6s ease; }
@keyframes glow { 0%{ text-shadow:0 0 0 transparent; transform:scale(1);} 40%{ text-shadow:0 0 14px var(--good); transform:scale(1.18);} 100%{ transform:scale(1);} }
.sign { position:absolute; font-family:-apple-system, "Segoe UI", system-ui, sans-serif; font-weight:500; font-size:calc(var(--rh) * .62); line-height:1; color:var(--ink); display:flex; align-items:flex-end; height:var(--rh); padding-bottom:calc(var(--rh)*.14); width:var(--cw); justify-content:center; }
.rule-line { position:absolute; height:2.5px; background:var(--ink); border-radius:2px; }
svg.bracket { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
svg.bracket path { stroke:var(--ink); stroke-width:3; fill:none; stroke-linecap:round; }
.rlabel { color:var(--accent); font-weight:700; }

/* side multiply problem */
.side { position:absolute; border:2px dashed var(--side-edge); background:var(--side-bg); border-radius:14px; }
.side.fading { animation:fadeOut .7s ease forwards; }
@keyframes fadeOut { 0%{opacity:1} 60%{opacity:1} 100%{opacity:0; transform:scale(.96)} }
.side-in { animation:sideIn .28s ease-out; }
@keyframes sideIn { from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.cell.carryc { font-size:calc(var(--rh) * .36); color:var(--carry); font-weight:800; padding-bottom:0; align-items:center; height:calc(var(--rh) * .6); }
.cell.focus { color:var(--accent); }
.cell.focus::before { content:''; position:absolute; left:14%; right:14%; bottom:4%; height:3px; border-radius:3px; background:var(--accent); opacity:.6; }
.cell.sp-filled { color:var(--ink); }

/* compare box */
.cmp { position:absolute; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 10px; border-radius:14px;
  background:var(--card); border:2px solid var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.15); animation:sideIn .25s ease-out; z-index:4; }
.cmp .q { font-weight:800; font-size:1rem; white-space:nowrap; }
.cmp .row { display:flex; gap:10px; }
.cmp button { min-width:84px; min-height:52px; border-radius:12px; border:2px solid var(--key-edge); background:var(--key); font-size:1.15rem; font-weight:800; }
.cmp button.yes { border-color:var(--good); color:var(--good); }
.cmp button.no { border-color:var(--bad); color:var(--bad); }
.cmp button:active { transform:scale(.96); }

/* ---------- input area ---------- */
#input { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--key-edge); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
#inner { display:grid; gap:10px; max-width:640px; margin:0 auto; grid-template-columns:1fr; grid-template-areas:"steps" "pad" "ctx"; }
.steps { grid-area:steps; display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
.padwrap { grid-area:pad; display:flex; flex-direction:column; gap:8px; }
.cmpbar { display:flex; flex-direction:column; gap:6px; padding:8px; border-radius:16px; background:var(--card); border:2px solid var(--accent); box-shadow:0 6px 18px rgba(0,0,0,.12); }
.cmpbar[hidden] { display:none; }
.cmpbar.in { animation:sideIn .22s ease-out; }
.cmpbar .cq { text-align:center; font-weight:800; font-size:1.05rem; }
.cmpbar .crow { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cbtn { min-height:max(64px, var(--kh, 58px)); border-radius:14px; border:2px solid var(--key-edge); background:var(--key); font-size:1.5rem; font-weight:900; box-shadow:0 3px 0 var(--key-edge); }
.cbtn.yes { border-color:var(--good); color:var(--good); }
.cbtn.no { border-color:var(--bad); color:var(--bad); }
.cbtn:active { transform:translateY(3px); box-shadow:none; }
.cell.cmpnum { color:var(--accent); font-weight:800; }
.cell.cmpnum::after { content:''; position:absolute; left:2%; right:2%; top:10%; bottom:4%; border-radius:8px; background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent); animation:slotPulse 1.3s ease-in-out infinite; }
.cell.cmpdiv { color:var(--accent); font-weight:800; }
.cell.cmpdiv::after { content:''; position:absolute; left:6%; right:6%; bottom:2%; height:3px; border-radius:3px; background:var(--accent); }
.pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.pad .zero { grid-column:1 / span 3; }
.ctx { grid-area:ctx; display:flex; gap:8px; }
.ctx button { flex:1; }
.key, .step, .ctxb { min-height:var(--kh, 58px); border-radius:14px; border:1px solid var(--key-edge); background:var(--key); color:var(--key-ink);
  box-shadow:0 3px 0 var(--key-edge); font-weight:800; transition:transform .06s, box-shadow .06s, background .15s, opacity .15s; position:relative; }
.key { font-size:1.6rem; }
.step { font-size:2rem; line-height:1; }
.ctxb { font-size:1.05rem; }
.key:active:not(:disabled), .step:active:not(:disabled), .ctxb:active:not(:disabled), .pressed { transform:translateY(3px); box-shadow:0 0 0 var(--key-edge); }
.step.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 3px 0 rgba(0,0,0,.25); }
.step.okflash { animation:okflash .45s ease; }
@keyframes okflash { 0%{ box-shadow:0 0 0 0 var(--good);} 60%{ box-shadow:0 0 0 10px transparent;} }
button:disabled { opacity:.38; cursor:default; background:var(--key-off); box-shadow:none; }
.ctxb.cant { border-color:var(--carry); color:var(--carry); }
.ctxb.hidden { display:none; }
.wrongflash { background:var(--bad) !important; color:#fff !important; }

@media (orientation: landscape) and (min-width: 700px) {
  #inner { max-width:1000px; grid-template-columns: 1.25fr 1fr; grid-template-areas:"steps pad" "ctx pad"; align-items:start; }
  .steps { align-self:stretch; }
  .step { min-height:calc(var(--kh, 54px) * 1.55); }
  #input { --kh: min(54px, 7.4vh); }
}
@media (orientation: portrait) { #input { --kh: min(60px, 6.2vh); } }

/* ---------- overlays ---------- */
.overlay { position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.card { background:var(--card); color:var(--ink); border-radius:22px; padding:24px 26px; width:min(560px, 100%); max-height:90vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center; animation:cardIn .35s cubic-bezier(.2,1.3,.4,1); }
@keyframes cardIn { from{ transform:scale(.85); opacity:0;} to{ transform:none; opacity:1;} }
.card h1 { margin:4px 0 6px; font-size:2rem; }
.card h2 { margin:4px 0 8px; font-size:1.6rem; }
.card p { margin:6px 0 14px; color:var(--ink-soft); font-weight:600; }
.big { min-height:58px; padding:0 28px; border-radius:16px; border:none; background:var(--accent); color:#fff; font-size:1.2rem; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.2); margin-top:8px; }
.big:active { transform:translateY(3px); box-shadow:none; }
.big.secondary { background:var(--key); color:var(--key-ink); border:1px solid var(--key-edge); }
.stars { font-size:2.6rem; letter-spacing:6px; margin:6px 0; }
.stars .s { display:inline-block; color:var(--key-edge); }
.stars .s.on { color:#f4b400; animation:starIn .5s cubic-bezier(.3,1.7,.5,1) backwards; }
@keyframes starIn { from{ transform:scale(0) rotate(-90deg);} to{ transform:none;} }
.eq { font-size:1.6rem; font-weight:700; margin:6px 0; color:var(--ink); }
.lvgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; margin:12px 0; text-align:left; }
.lv { min-height:64px; border-radius:14px; border:2px solid var(--key-edge); background:var(--key); padding:8px 10px; text-align:left; }
.lv b { display:block; font-size:1rem; }
.lv span { font-size:.78rem; color:var(--ink-soft); font-weight:600; }
.lv.sel { border-color:var(--accent); background:var(--accent-soft); }
.set-row { display:flex; flex-direction:column; gap:8px; text-align:left; margin:14px 0; }
.set-row > label { font-weight:800; font-size:.95rem; }
.seg { display:flex; gap:6px; flex-wrap:wrap; }
.seg button { flex:1; min-height:50px; border-radius:12px; border:2px solid var(--key-edge); background:var(--key); font-weight:700; padding:4px 10px; }
.seg button.sel { border-color:var(--accent); background:var(--accent-soft); }
.seg button .soon { display:block; font-size:.7rem; color:var(--ink-soft); font-weight:600; }
.toast { position:fixed; left:50%; top:76px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-weight:700; z-index:80; animation:fadeIn .2s; pointer-events:none; }
.flyer { position:fixed; z-index:60; pointer-events:none; display:flex; align-items:flex-end; justify-content:center; color:var(--ink); font-weight:600; line-height:1; will-change:transform; }
.flyer.ghost { opacity:.55; color:var(--accent); }
.confetti { position:fixed; width:10px; height:14px; z-index:70; pointer-events:none; border-radius:2px; }
.combo { position:fixed; z-index:65; pointer-events:none; font-weight:900; color:var(--good); font-size:1.3rem; }
/* ================= Man vs. Math additions ================= */
@font-face { font-family:"Cinzel MVM"; src:url(assets/fonts/cinzel-900.woff2) format("woff2"); font-weight:900; font-display:swap; }
@font-face { font-family:"Arcade MVM"; src:url(assets/fonts/press-start-2p.woff2) format("woff2"); font-display:swap; }
[data-theme="journal"] {
  --app-bg:#2b1d12; --paper:#f1e2bf; --rule:rgba(124,92,52,.2); --margin:rgba(160,70,45,.32); --ink:#3b2a1a; --ink-soft:#7a6446;
  --accent:#2f6b3a; --accent-soft:rgba(47,107,58,.16); --carry:#b4541f; --good:#3d8b3a; --bad:#c23b2a; --warn:#d18f1c;
  --panel:#3a2817; --key:#d6cfc0; --key-ink:#2a2219; --key-edge:#6e604c; --key-off:#55463a; --header:#3a2615;
  --slot:#6b5636; --side-bg:rgba(90,120,60,.08); --side-edge:rgba(70,100,45,.45); --overlay:rgba(20,12,6,.62); --card:#f3e6c6;
  --vine:#3f6b2a;

/* strength power-up banner (map / header) */
.strboost { position:fixed; left:max(14px, 2vw); right:auto; bottom:max(118px, calc(14vh + env(safe-area-inset-bottom))); top:auto; transform:none; z-index:120; width:min(340px, 42vw); pointer-events:none; overflow:visible;

.mlab.cur rect { fill:rgba(140,30,18,.88); stroke:#ffd43b; }
.mlab.done rect { fill:rgba(40,90,40,.82); }
.mlab.todo { opacity:.88; }
.mlab.rv text { fill:#ffe9a8; }
.mk.rv .ring { fill:#7a1d12; stroke:#ffd43b; }
.mchoice { position:absolute; left:auto; right:3%; bottom:11%; width:min(260px, 34%); display:flex; flex-direction:column; gap:10px; justify-content:flex-end; align-items:stretch; z-index:3; opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity .35s, transform .35s cubic-bezier(.2,1.4,.4,1); }
.mchoice.show { opacity:1; transform:none; pointer-events:auto; }
.mchoice .mcbtn { flex:0 0 auto; max-width:none; width:100%; min-height:58px; font-size:clamp(0.95rem, 2vh, 1.2rem); }
.mapbox > img { position:absolute; inset:0; width:100%; height:100%; display:block; }
.mapbox > svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.dot { fill:#e01b1b; stroke:#fff1cc; stroke-width:2.5; opacity:0; transform-box:fill-box; transform-origin:center; }
.dot.old { opacity:.6; fill:#a3241c; }
.dot.on { opacity:1; animation:dotPop .38s cubic-bezier(.3,1.9,.5,1); }
@keyframes dotPop { from { transform:scale(0); } to { transform:scale(1); } }
.mk .ring { fill:rgba(28,16,6,.72); stroke:#f3c65a; stroke-width:4; }
.mk text { fill:#fff3d0; font:900 25px "Cinzel MVM", Georgia, serif; text-anchor:middle; dominant-baseline:central; }
.mk.done .ring { fill:#2f6b2a; }
.mk.todo { opacity:.8; }
.mk.start .ring { fill:#7a1d12; }
.mk .pulse { fill:none; stroke:#ff3b2f; stroke-width:5; transform-box:fill-box; transform-origin:center; animation:ringPulse 1.2s ease-out infinite; }
.mk.cur .ring { fill:#b3261a; }
.mk.arrived .ring { animation:arrive .6s cubic-bezier(.3,1.8,.5,1); transform-box:fill-box; transform-origin:center; }
@keyframes ringPulse { from { transform:scale(.9); opacity:1; } to { transform:scale(1.9); opacity:0; } }
@keyframes arrive { 0% { transform:scale(1); } 40% { transform:scale(1.45); } 100% { transform:scale(1); } }
.mban { position:absolute; top:2.5%; left:6%; right:6%; text-align:center; padding:1.2vh 2vh 1.6vh; border-radius:18px; background:radial-gradient(ellipse at center, rgba(20,12,4,.72), rgba(20,12,4,.35) 70%, rgba(20,12,4,0));
  animation:banIn .8s .35s cubic-bezier(.2,1.5,.4,1) both; pointer-events:none; }
@keyframes banIn { from { opacity:0; transform:translateY(-30px) scale(.8); } to { opacity:1; transform:none; } }
.mep { font-family:"Cinzel MVM", Georgia, serif; font-weight:900; font-size:2.2vh; letter-spacing:.22em; text-transform:uppercase; color:#f6e7c4; text-shadow:0 2px 4px #000; }
.mlv { font-family:"Cinzel MVM", Georgia, serif; font-weight:900; font-size:8.4vh; line-height:1; letter-spacing:.06em; text-transform:uppercase; margin:.4vh 0;
  background:linear-gradient(180deg, #fff7d6 0%, #f3c65a 45%, #b6721c 75%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 0 #2a1606) drop-shadow(0 6px 10px rgba(0,0,0,.8)); }
.mname { font-family:"Cinzel MVM", Georgia, serif; font-weight:900; font-size:3.6vh; letter-spacing:.06em; color:#fff3d0; text-shadow:0 2px 6px #000, 0 0 2px #000; }
.msoon { position:absolute; left:8%; right:8%; bottom:2.5%; text-align:center; font-weight:800; font-size:1.8vh; color:#fff3d0; background:rgba(20,12,4,.7); border:1px solid rgba(243,198,90,.5); border-radius:999px; padding:1vh 2vh; }
/* lose */
.cscreen.lose img.cv { animation:losePunch .55s cubic-bezier(.2,1.6,.4,1) both; filter:saturate(1.22) contrast(1.07); }
@keyframes losePunch { from { transform:scale(1.25); filter:brightness(2) saturate(0); } to { transform:none; } }
.cscreen.lose::before { content:''; position:absolute; left:0; right:0; top:0; height:34vh; z-index:1; pointer-events:none; background:linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.35) 60%, transparent); }
.cscreen.lose::after { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
.ylose { position:absolute; z-index:2; top:calc(6vh + env(safe-area-inset-top)); left:0; right:0; text-align:center; font-family:"Arcade MVM", "Courier New", monospace; font-size:clamp(2.6rem, 8.6vw, 6.4rem); line-height:1.1;
  color:#ffd43b; text-shadow:4px 4px 0 #c1121f, 8px 8px 0 #3a0a06, 0 0 34px rgba(0,0,0,.8); letter-spacing:.04em; animation:yloseIn .7s .25s cubic-bezier(.2,1.8,.4,1) both, yloseWob 1.4s 1.1s ease-in-out infinite; }
@keyframes yloseIn { from { opacity:0; transform:scale(3) rotate(-8deg); } to { opacity:1; transform:none; } }
@keyframes yloseWob { 0%,100% { transform:rotate(-2deg) scale(1); } 50% { transform:rotate(2deg) scale(1.04); } }
.lreason { position:absolute; z-index:2; top:calc(6vh + clamp(2.6rem, 8.6vw, 6.4rem) * 1.25 + 2vh + env(safe-area-inset-top)); left:0; right:0; text-align:center; font-family:"Arcade MVM", "Courier New", monospace;
  font-size:clamp(.9rem, 1.9vw, 1.35rem); color:#fff; text-shadow:3px 3px 0 #000; animation:fadeUp .5s .8s both; }
.again { position:absolute; z-index:2; bottom:calc(5vh + env(safe-area-inset-bottom)); left:50%; min-height:78px; padding:0 44px; border-radius:20px; border:3px solid #ffd43b; background:linear-gradient(#e0342a, #9b1410); color:#fff;
  font-family:"Arcade MVM", "Courier New", monospace; font-size:clamp(1rem, 2.3vw, 1.4rem); box-shadow:0 6px 0 #4a0a06, 0 14px 30px rgba(0,0,0,.6);
  transform:translateX(-50%) scale(.5); opacity:0; pointer-events:none; transition:transform .4s cubic-bezier(.2,1.7,.4,1), opacity .3s; }
.again.show { opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto; }
.again:active { transform:translateX(-50%) translateY(4px); }
.autonote { font-size:.85rem; color:var(--ink-soft); margin-top:8px; }
/* dev panel */
#devp { position:fixed; left:6px; bottom:6px; z-index:300; display:flex; flex-wrap:wrap; gap:4px; max-width:560px; padding:6px; border-radius:10px; background:rgba(0,0,0,.78); color:#fff; font:700 12px system-ui, sans-serif; align-items:center; }
#devp button, #devp select { font:700 12px system-ui, sans-serif; padding:5px 7px; border-radius:6px; border:1px solid #666; background:#222; color:#fff; }

/* ================= login, resume, leaderboard, teacher, alerts ================= */
.cscreen.login, .cscreen.resume { align-items:stretch; }
.cscreen.login img.hero, .cscreen.resume img.hero { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:68% 50%; }
.lgwrap { position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; align-items:center; gap:2vh; padding:calc(4vh + env(safe-area-inset-top)) 20px calc(64px + env(safe-area-inset-bottom)); }
.lghead { text-align:center; }
.tlogo.sm { font-size:clamp(2.4rem, 7vw, 5.4rem); }

.lgcard { background:rgba(24,15,7,.84); border:2px solid rgba(243,198,90,.55); border-radius:20px; padding:18px 20px; box-shadow:0 14px 40px rgba(0,0,0,.6); color:#f6e7c4; text-align:left; }

.lgmsg { min-height:1.5em; margin-top:8px; font-weight:700; font-size:.98rem; } .lgmsg.ok { color:#bfe3a6; } .lgmsg.bad { color:#ff9c8a; }
.lghint { margin:-4px 0 10px; color:#e3cfa3; font-weight:600; }
.lgsub { margin:12px 0 8px; font-weight:800; color:#e3cfa3; font-size:.95rem; }
.lgnames { display:flex; flex-wrap:wrap; gap:8px; max-height:26vh; overflow:auto; }

.lgnote { margin-top:12px; font-size:.85rem; color:#e3cfa3; opacity:.8; }
.lgteach { position:absolute; right:14px; bottom:calc(12px + env(safe-area-inset-bottom)); min-height:40px; padding:0 14px; border-radius:999px; border:1px solid rgba(255,255,255,.28); background:rgba(0,0,0,.45); color:rgba(255,255,255,.72); font-weight:700; font-size:.85rem; z-index:3; }
.rscard { margin:auto; width:min(640px, 100%); text-align:center; }
.rscard h1 { font-family:"Cinzel MVM", Georgia, serif; font-weight:900; color:#f3c65a; font-size:clamp(1.7rem, 4vw, 2.5rem); margin:4px 0 10px; }
.rsline { font-size:1.2rem; font-weight:800; color:#fff3d0; margin:6px 0; }
.rsdet { color:#e3cfa3; font-weight:600; margin:0 0 12px; }
.rsmeter { display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 16px; font-weight:800; }

.rsbtns { display:flex; flex-direction:column; gap:10px; }

/* leaderboard */
.lbtabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }

.lbt .ck { color:#8fd16f; font-weight:900; } .lbt .no { opacity:.35; }
.lbempty { opacity:.8; padding:10px 0; font-weight:700; }

.mderr { min-height:1.3em; color:#ff9c8a; font-weight:700; margin:8px 0; }

.tchrow button.danger { border-color:#ff9c8a; color:#ffb3a6; }
/* alerts */

.atoast.out { opacity:0; transform:translateY(-10px); }
@keyframes atIn { from { opacity:0; transform:translateY(-20px) scale(.9); } to { opacity:1; transform:none; } }

.mlb { position:absolute; right:3%; bottom:3%; z-index:3; min-width:56px; height:56px; padding:0 14px; border-radius:999px; border:2px solid #f3c65a; background:rgba(20,12,4,.78); color:#fff3d0; font-size:1.4rem; box-shadow:0 6px 16px rgba(0,0,0,.5); }

<script>
(function () {

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ================= settings / storage ================= */
const store = {
  get(k, def) { try { const v = localStorage.getItem("mvm1." + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },

};
const settings = { theme: store.get("theme", "journal"), format: "remainders", sound: store.get("sound", true), music: store.get("music", true), haptics: store.get("haptics", true) };
const THEMES = [["journal", "Explorer's journal"], ["notebook", "Notebook"], ["sand", "Sand"], ["slate", "Slate"]];

let ANIM = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0.35 : 1;

/* ================= levels ================= */
const LEVELS = [
  { name: "One-digit divisors", desc: "1-digit ÷ into 3- and 4-digit numbers", shapes: [[1, 3], [1, 3], [1, 4], [1, 4]] },
  { name: "Two-digit divisors", desc: "2-digit ÷ into 4- and 5-digit numbers", shapes: [[2, 4], [2, 4], [2, 5], [2, 5]] },
  { name: "Three-digit divisors", desc: "3-digit ÷ into 5- and 6-digit numbers", shapes: [[3, 5], [3, 5], [3, 6], [3, 6]] },
  { name: "Four-digit divisors", desc: "4-digit ÷ into 6-digit numbers", shapes: [[4, 6], [4, 6]] }
];

/* ================= math engine ================= */
function subNeedsBorrow(top, bot) {
  const T = top.split("").map(Number).reverse(), B = bot.split("").map(Number).reverse();
  let br = 0;
  for (let k = 0; k < T.length; k++) { const t = T[k] - br, b = B[k] || 0; if (t < b) return true; br = 0; }
  return false;
}
function analyze(D, d) {
  const digs = D.split("").map(Number), n = digs.length;
  let p = 0, cur = digs[0];
  while (cur < d && p < n - 1) { p++; cur = cur * 10 + digs[p]; }
  const cycles = []; let topStr = D.slice(0, p + 1), pos = p, zero = false, borrow = false;
  for (;;) {
    const top = parseInt(topStr, 10), q = Math.floor(top / d), prod = q * d, diff = top - prod;
    if (q === 0) zero = true;
    if (subNeedsBorrow(topStr, String(prod))) borrow = true;
    cycles.push({ pos, topStr, q, prod, diff });
    if (pos >= n - 1) break;
    pos++; topStr = String(diff) + digs[pos];
  }
  return { p, cycles, quotient: cycles.map(c => c.q).join(""), remainder: cycles[cycles.length - 1].diff, zero, borrow, n, valid: parseInt(D.slice(0, p + 1), 10) >= d };

/* Multiply scaffold: ones digit, then carry (only if non-zero). Never a full multi-digit product. */
function mulSteps(q, d) {
  const ds = String(d).split("").map(Number).reverse(); // from right
  if (q === 0) return [{ kind: "write", place: 0, val: 0, j: 0, c: 0 }];
  const steps = []; let c = 0;
  for (let j = 0; j < ds.length; j++) {
    const t = q * ds[j] + c;
    steps.push({ kind: "write", place: j, val: t % 10, j, c });
    const nc = Math.floor(t / 10);
    if (nc > 0) {
      if (j < ds.length - 1) steps.push({ kind: "carry", j: j + 1, val: nc });

  try { const pre = LVI(ep, lv); if (pre) getVideo(pre.setup); } catch (e) {}

const highestEp = r => { let h = r.episode || 0; Object.keys(r.passed || {}).forEach(k => { h = Math.max(h, +k.split("-")[0]); }); return h + 1; };
const hasProgress = r => !!r && (r.done || passedCount(r) > 0 || r.episode > 0 || r.level > 0);
const evId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---- storage adapter: localStorage (default) ---- */
const LK = { players: "mvm.players.v1", events: "mvm.events.v1", pin: "mvm.teacherPin.v1" };
const lget = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const LocalDB = {
  kind: "local", subs: [],
  async init() {},
  async players() { return lget(LK.players, {}); },
  async savePlayer(r) { const all = lget(LK.players, {}); all[r.id] = r; lset(LK.players, all); },
  async removePlayer(id) { const all = lget(LK.players, {}); delete all[id]; lset(LK.players, all); lset(LK.events, lget(LK.events, []).filter(e => e.pid !== id)); },
  async resetAll() { localStorage.removeItem(LK.players); localStorage.removeItem(LK.events); },
  async pushEvent(ev) { const a = lget(LK.events, []); a.push(ev); while (a.length > 300) a.shift(); lset(LK.events, a); LocalDB.emit(ev); },
  async clearEvents() { localStorage.removeItem(LK.events); },
  async events() { return lget(LK.events, []); },
  emit(ev) { LocalDB.subs.slice().forEach(s => { if (ev.ts > s.since) s.cb(ev); }); },
  onEvent(since, cb) { const s = { since, cb }; LocalDB.subs.push(s); return () => { LocalDB.subs = LocalDB.subs.filter(x => x !== s); }; },
  async getPin() { return lget(LK.pin, null); },
  async setPin(v) { if (v) lset(LK.pin, v); else localStorage.removeItem(LK.pin); }
};
window.addEventListener("storage", e => { // other tabs on this device
  if (e.key !== LK.events || !e.newValue) return;
  let old = []; try { old = JSON.parse(e.oldValue || "[]"); } catch (x) {}
  const seen = new Set(old.map(v => v.id)); try { JSON.parse(e.newValue).filter(v => !seen.has(v.id)).forEach(v => LocalDB.emit(v)); } catch (x) {}
});
/* ---- storage adapter: Firebase Realtime Database (when FIREBASE_CONFIG is filled in) ---- */
function FirebaseDB() {
  let db, M, A, auth; const base = "https://www.gstatic.com/firebasejs/" + FB_VER + "/";
  const R = p => M.ref(db, p);
  const F = {
    kind: "firebase",
    async init() {
      const app = await import(base + "firebase-app.js"); M = await import(base + "firebase-database.js");
      const fa = app.initializeApp(FIREBASE_CONFIG); db = M.getDatabase(fa);
      if (FIREBASE_OPTIONS.auth) { A = await import(base + "firebase-auth.js"); auth = A.getAuth(fa); await new Promise(r => { const u = A.onAuthStateChanged(auth, () => { u(); r(); }); }); if (!auth.currentUser) await A.signInAnonymously(auth); }
    },
    uid() { return auth && auth.currentUser ? auth.currentUser.uid : null; },
    authOn: () => !!FIREBASE_OPTIONS.auth,
    isAdmin() { return !!(auth && auth.currentUser && !auth.currentUser.isAnonymous); },
    adminEmail() { return auth && auth.currentUser ? auth.currentUser.email : ""; },
    async adminSignIn() { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); },
    async players() { return (await M.get(R("players"))).val() || {}; },
    async savePlayer(r) { const u = F.uid(); if (u && !r.uid && !F.isAdmin()) r.uid = u; await M.set(R("players/" + r.id), r); },
    async removePlayer(id) {
      await M.remove(R("players/" + id));
      const s = await M.get(M.query(R("events"), M.orderByChild("pid"), M.equalTo(id))); const up = {};
      s.forEach(c => { up[c.key] = null; }); if (Object.keys(up).length) await M.update(R("events"), up);
    },
    async resetAll() { await M.remove(R("players")); await M.remove(R("events")); },
    async pushEvent(ev) { await M.set(M.push(R("events")), ev); },
    async clearEvents() { await M.remove(R("events")); },
    async events() { return Object.values((await M.get(R("events"))).val() || {}); },
    onEvent(since, cb) { return M.onChildAdded(M.query(R("events"), M.orderByChild("ts"), M.startAt(since + 1)), s => { const v = s.val(); if (v && v.ts > since) cb(v); }); },
    async getPin() { return (await M.get(R("config/teacherPinHash"))).val(); },
    async setPin(v) { await M.set(R("config/teacherPinHash"), v || null); }
  };
  return F;
}

const Progress = {
  cur: null, since: 0, unsub: null,
  async login(name) {
    await dbReady;
    const all = await DB.players().catch(() => ({}));
    let r = Object.values(all).find(p => p && p.name && p.name.toLowerCase() === name.toLowerCase());
    const isNew = !r; if (!r) { r = newRec(name); await DB.savePlayer(r).catch(() => {}); }
    r.passed = r.passed || {};
    this.cur = r; this.since = Date.now();
    if (this.unsub) { try { this.unsub(); } catch (e) {} }
    this.unsub = DB.onEvent(this.since, ev => alertToast(ev.name + " passed Level " + (ev.lv + 1) + " of Episode " + (ev.ep + 1) + "."));
    return { rec: r, isNew };
  },
  logout() { if (this.unsub) { try { this.unsub(); } catch (e) {} } this.unsub = null; this.cur = null; },
  async save(patch) {
    if (!this.cur) return;
    Object.assign(this.cur, patch, { ts: Date.now() });
    try { await DB.savePlayer(this.cur); } catch (e) { console.warn("save failed", e); alertToast("Couldn't save — check the connection."); }
  },
  async levelPassed(ep, lv, strength) {
    const r = this.cur; if (!r) return;
    const lastLv = lv + 1 >= LEVELS.length, lastEp = ep + 1 >= EPISODES.length;
    r.passed = r.passed || {}; r.passed[ep + "-" + lv] = Date.now();
    const nx = !lastLv ? [ep, lv + 1] : !lastEp ? [ep + 1, 0] : [ep, lv];
    await this.save({ episode: nx[0], level: nx[1], strength, done: !!r.done || (lastLv && lastEp),
      unlocked: Math.max(r.unlocked || 1, Math.min(EPISODES.length, lastLv ? ep + 2 : ep + 1)) });
    try { await DB.pushEvent({ id: evId(), pid: r.id, name: r.name, ep, lv, ts: Date.now() }); } catch (e) {}
  },
  async saveLater(ep, lv, strength) { await this.save({ episode: ep, level: lv, strength }); },
  async lost(ep) { await this.save({ episode: ep, level: 0, strength: 100 }); },
  canJump(ep, lv) { const r = this.cur; if (!r || DEV) return true; if (lv === 0 || (r.passed || {})[ep + "-" + (lv - 1)]) return true; return ep < r.episode || (ep === r.episode && lv <= r.level) || !!r.done; }
};

async function sha256(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join(""); }

      if (k === "t-add") { const v = await ask({ title: "Add a student", text: "First name and last initial.", input: "text", placeholder: "e.g. Sam T.", ok: "Add", check: nameCheck(null) }); if (v !== false) await guard(() => DB.savePlayer(newRec(normName(v)))); return; }
      if (k === "t-ren" && r) { const v = await ask({ title: "Rename " + r.name, text: "First name and last initial.", input: "text", value: r.name, ok: "Rename", check: nameCheck(r.id) }); if (v !== false) await guard(() => DB.savePlayer(Object.assign({}, r, { name: normName(v) }))); return; }
      if (k === "t-del" && r) { const v = await ask({ title: "Remove " + r.name + "?", text: "This deletes " + r.name + "'s saved game, progress and alerts. It can't be undone.", ok: "Remove", danger: true }); if (v !== false) await guard(() => DB.removePlayer(r.id)); return; }
      if (k === "t-alerts") { const v = await ask({ title: "Clear alerts?", text: "Removes the history of “passed a level” alerts. Student progress stays.", ok: "Clear alerts" }); if (v !== false) await guard(() => DB.clearEvents()); if (v !== false) alertToast("Alerts cleared."); return; }
      if (k === "t-reset") { const v = await ask({ title: "Reset everything?", text: "This deletes every student, every saved game, the scoreboard and all alerts. Type RESET to confirm.", input: "text", placeholder: "RESET", ok: "Reset everything", danger: true, check: v => v === "RESET" ? null : "Type RESET in capital letters." }); if (v !== false) { await guard(() => DB.resetAll()); alertToast("Scoreboard and student data reset."); } return; }
      if (k === "t-csv") { const csv = rosterCsv(players); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "man-vs-math-roster-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); window.__lastCsv = csv; return; }
    };
    load();
  });
}

/* ================= dev tools (?dev=1) ================= */
async function devSolve() {
  if (!G.P || G.overlay) return "not playing";
  startProblem();
  const P = G.P, A = P.A, w = ms => new Promise(r => setTimeout(r, ms));
  const go = async (a, b) => { lockUntil = 0; act(a, b); await w(ANIM ? 60 : 8); };
  await go("place", A.p);
  for (let k = 0; k < A.cycles.length; k++) {
    const C = A.cycles[k];
    if (k > 0) await go("step", "divide");
    await go("digit", C.q); await go("step", "multiply");
    for (const st of mulSteps(C.q, P.d)) await go("digit", st.val);
    await w(ANIM ? 800 : 20); await go("step", "subtract");
    for (let guard = 0; guard < 40 && G.P === P && P.phase === "subtract"; guard++) {
      const s = P.cycles[k].sub, col = s.col, bb = s.B[col] || 0;
      if (s.work[col] < bb) { if (leadingOneBorrow(s, col)) await go("digit", s.work[col] + 10 - bb); else await go("top", col + 1); }
      else await go("digit", s.work[col] - bb);
    }
    await go("step", "compare"); await go("yes");
    if (k < A.cycles.length - 1) { await go("step", "bring"); await w(ANIM ? 600 : 20); }
  }
  if (A.remainder > 0) { await go("remainder"); for (const ch of String(A.remainder)) await go("digit", +ch); }
  else await go("done");
  return "solved " + P.D + "/" + P.d;
}

    const boostQ = new URLSearchParams(location.search).get("boost");
    try { ANIM = boostQ ? 1 : 0.001; } catch (e) {}
    setTimeout(() => { try { window.__MVM && window.__MVM.setAnim && window.__MVM.setAnim(boostQ ? 1 : 0.001); } catch (e) {}
      Cine.map(ep, lv, { choice: true, showSave: !(ep === 0 && lv === 0) });
      if (boostQ) {
        const bp = boostQ.split(/[,:]/).map(n => +n);
        const from = Number.isFinite(bp[0]) ? bp[0] : 40, to = Number.isFinite(bp[1]) ? bp[1] : 70;
        setTimeout(() => { try { showStrengthBoost(from, to, { dur: 900, hold: 20000 }); } catch (e) {} }, 350);
      }
    }, 200);
  }
  const d = document.createElement("div"); d.id = "devp";
  d.innerHTML = 'DEV <select id="dv-ep"><option value="0">E1</option><option value="1">E2</option><option value="2">E3</option></select><select id="dv-lv"><option value="0">L1</option><option value="1">L2</option><option value="2">L3</option><option value="3">L4</option></select>' +
    '<button data-dev="go">Go (map+clip)</button><button data-dev="direct">Go (no clips)</button><button data-dev="skip">Skip clip</button><button data-dev="solve">Solve</button><button data-dev="win">Win level</button><button data-dev="lose">Lose</button><button data-dev="time">Time→12s</button><button data-dev="unlock">Unlock all</button><button data-dev="reset">Reset unlock</button><button data-dev="logout">Log out</button><button data-dev="clearpin">Clear teacher PIN</button><button data-dev="hide">×</button>';
  document.body.appendChild(d);
  d.addEventListener("click", e => {
    e.stopPropagation(); audio();
    const b = e.target.closest("[data-dev]"); if (!b) return;
    const ep = +d.querySelector("#dv-ep").value, lv = +d.querySelector("#dv-lv").value, k = b.dataset.dev;
    if (k === "go") beginLevel(ep, lv, false);
    if (k === "direct") { flowTok++; Cine.hide(); G.started = true; G.episode = ep; Music.play("bed"); newLevel(lv, false); preloadLevel(lv); }
    if (k === "skip") Cine.skip();
    if (k === "solve") devSolve();
    if (k === "win") { if (G.P && !G.overlay) { G.probIdx = G.problems.length - 1; devSolve(); } }
    if (k === "lose") { if (G.P && !G.overlay && G.P.phase !== "over") { G.strength = 10; penalty(); } }
    if (k === "time") { if (G.P) G.timeLeft = 12; }
    if (k === "unlock") { store.set("unlocked", 3); toast("All episodes unlocked"); }
    if (k === "reset") { store.set("unlocked", 1); toast("Unlocks reset"); }
    if (k === "logout") { Progress.logout(); runTitle(); }
    if (k === "clearpin") { dbReady.then(() => DB.setPin(null)).then(() => toast("Teacher PIN cleared — the next Teacher visit creates a new one"), e => toast("Couldn't clear the PIN: " + e)); }
    if (k === "hide") d.remove();
  });
}
